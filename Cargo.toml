[package]
name = "net-combiner"
version = "0.1.10"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform GUI for combining local network adapters behind a SOCKS proxy and optional local TUN routing."
license = "MIT"
repository = "https://github.com/ivLis-Studio/net-combiner"
homepage = "https://github.com/ivLis-Studio/net-combiner"

[build-dependencies]
winresource = "0.1"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.32"
image = { version = "0.25", default-features = false, features = ["png"] }
network-interface = "2.0"
reqwest = { version = "0.13", default-features = false }
raw-window-handle = "0.6"
self_update = { version = "0.44", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate", "default-tls", "reqwest"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.23"
