name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libssl-dev pkg-config

      - name: Build net-combiner
        env:
          NET_COMBINER_UPDATE_OWNER: ${{ github.repository_owner }}
          NET_COMBINER_UPDATE_REPO: ${{ github.event.repository.name }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Install tun2proxy sidecar
        run: cargo install tun2proxy --locked --root sidecar --target ${{ matrix.target }}

      - name: Stage files
        shell: bash
        run: |
          mkdir -p dist/net-combiner
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/net-combiner.exe" dist/net-combiner/
            if [[ -f sidecar/bin/tun2proxy-bin.exe ]]; then cp sidecar/bin/tun2proxy-bin.exe dist/net-combiner/; fi
            if [[ -f sidecar/bin/tun2proxy.exe ]]; then cp sidecar/bin/tun2proxy.exe dist/net-combiner/; fi
          else
            cp "target/${{ matrix.target }}/release/net-combiner" dist/net-combiner/
            if [[ -f sidecar/bin/tun2proxy-bin ]]; then cp sidecar/bin/tun2proxy-bin dist/net-combiner/; fi
            if [[ -f sidecar/bin/tun2proxy ]]; then cp sidecar/bin/tun2proxy dist/net-combiner/; fi
          fi
          cp README.md README.ko.md LICENSE dist/net-combiner/

      - name: Add Wintun DLL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun\wintun\bin\amd64\wintun.dll dist\net-combiner\

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }
          if (-not ($version -match '^\d+\.\d+\.\d+')) {
            $version = "0.1.0"
          }
          $env:NET_COMBINER_VERSION = $version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /O. packaging\windows\net-combiner.iss

      - name: Create macOS app package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            version="0.1.0"
          fi
          app="pkgroot/Applications/net-combiner.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/net-combiner" "$app/Contents/MacOS/"
          if [[ -f sidecar/bin/tun2proxy-bin ]]; then cp sidecar/bin/tun2proxy-bin "$app/Contents/MacOS/"; fi
          if [[ -f sidecar/bin/tun2proxy ]]; then cp sidecar/bin/tun2proxy "$app/Contents/MacOS/"; fi
          chmod +x "$app/Contents/MacOS/net-combiner" "$app/Contents/MacOS/"tun2proxy* || true
          mkdir -p icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z "$s" "$s" assets/net-combiner-icon.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
            if [[ "$s" != "512" ]]; then
              double=$((s * 2))
              sips -z "$double" "$double" assets/net-combiner-icon.png --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
            fi
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/net-combiner.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>net-combiner</string>
            <key>CFBundleIdentifier</key><string>com.net-combiner.app</string>
            <key>CFBundleName</key><string>net-combiner</string>
            <key>CFBundleDisplayName</key><string>net-combiner</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleIconFile</key><string>net-combiner</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          pkgbuild \
            --root pkgroot \
            --identifier com.net-combiner.app \
            --install-location / \
            --version "$version" \
            "net-combiner-${{ matrix.target }}.pkg"

      - name: Create Linux deb package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            version="0.1.0"
          fi
          root="debroot"
          mkdir -p "$root/DEBIAN" "$root/opt/net-combiner" "$root/usr/share/applications" "$root/usr/share/icons/hicolor/256x256/apps"
          cp dist/net-combiner/net-combiner "$root/opt/net-combiner/"
          if [[ -f dist/net-combiner/tun2proxy-bin ]]; then cp dist/net-combiner/tun2proxy-bin "$root/opt/net-combiner/"; fi
          if [[ -f dist/net-combiner/tun2proxy ]]; then cp dist/net-combiner/tun2proxy "$root/opt/net-combiner/"; fi
          chmod 0755 "$root/opt/net-combiner/net-combiner" "$root/opt/net-combiner/"tun2proxy* || true
          cp assets/net-combiner-icon.png "$root/usr/share/icons/hicolor/256x256/apps/net-combiner.png"
          cat > "$root/usr/share/applications/net-combiner.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=net-combiner
          Exec=/opt/net-combiner/net-combiner
          Icon=net-combiner
          Terminal=false
          Categories=Network;
          DESKTOP
          cat > "$root/DEBIAN/control" <<CONTROL
          Package: net-combiner
          Version: $version
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: net-combiner
          Description: Combine local network adapters behind a SOCKS proxy and local VPN route.
          CONTROL
          dpkg-deb --build "$root" "net-combiner-${{ matrix.target }}.deb"

      - name: Create zip archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path dist\net-combiner\* -DestinationPath "net-combiner-portable-${{ matrix.target }}.zip"

      - name: Create tar archive
        if: matrix.archive == 'tar'
        run: tar -C dist -czf "net-combiner-portable-${{ matrix.target }}.tar.gz" net-combiner

      - uses: actions/upload-artifact@v4
        with:
          name: net-combiner-${{ matrix.name }}
          path: |
            net-combiner-portable-${{ matrix.target }}.zip
            net-combiner-portable-${{ matrix.target }}.tar.gz
            net-combiner-windows-x86_64-setup.exe
            net-combiner-${{ matrix.target }}.pkg
            net-combiner-${{ matrix.target }}.deb
          if-no-files-found: ignore

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: artifacts/*
